[project]
name = "textropy-backend"
version = "0.2.1"
description = "Textropy backend — stateless multi-pass linguistic text analysis API"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- Web framework (spec §8) ---
    # The `standard` extra brings the `fastapi` CLI (`fastapi dev` / `fastapi run`) plus
    # uvicorn[standard]. The `-no-fastapi-cloud-cli` variant is the same thing minus
    # fastapi-cloud-cli, a deploy client for FastAPI Cloud that this self-hosted MVP has no
    # use for and that pulls sentry-sdk in with it.
    "fastapi[standard-no-fastapi-cloud-cli]>=0.117",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- NLP core ---
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    # --- Transformers stack: sentiment (DistilBERT SST-2), causal LM (DistilGPT2) ---
    "torch>=2.4",
    "transformers>=4.44",
    # --- Embeddings (all-MiniLM-L6-v2) ---
    "sentence-transformers>=3.2",
    # --- Similarity / distance (spec §8) ---
    "rapidfuzz>=3.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "numpy>=1.26",
    "pot>=0.9",
]

# Coreference is isolated as an extra: fastcoref (last released 2023) is the least maintained
# dependency in the stack. It reaches into transformers internals that changed in v5 — loading
# it against transformers 5.x fails with `'FCorefModel' object has no attribute
# 'all_tied_weights_keys'` — so the extra carries the upper bound that makes it work.
# sentence-transformers accepts transformers>=4.41,<6, so 4.x satisfies the whole stack.
# Without this extra installed, the Tier 2 `coreference` feature reports itself unavailable and
# every other feature keeps working.
[project.optional-dependencies]
coref = ["fastcoref>=2.1.6", "transformers<5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

# PyPI's linux torch wheels are the CUDA build: they pull cuda-bindings plus ~15 nvidia-*
# packages, several GB of GPU libraries into a deployment that runs device="cpu" everywhere
# on a GPU-less VPS. This index carries the CPU-only wheels instead. `explicit = true` means
# nothing is drawn from it unless a [tool.uv.sources] entry below asks for it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# Linux only: macOS wheels on PyPI are already CPU-only, so local dev on a Mac keeps
# resolving exactly as before.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "heavy: tests that load Tier 2/3 ML models (deselect with '-m \"not heavy\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
